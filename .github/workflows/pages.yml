name: Deploy Korea itinerary to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate itinerary datasets & cross-site links across all sessions
        run: |
          python3 -m json.tool data/itinerary.json >/dev/null
          python3 scripts/verify-week2.py
          python3 - <<'PY'
          import json
          rows = json.load(open('data/itinerary.json', encoding='utf-8'))
          assert rows, 'No itinerary rows found'
          for n, row in enumerate(rows, 1):
              assert row.get('item'), f'Row {n} has no item'
              assert row.get('source', '').startswith('https://'), f'Row {n} has no HTTPS source'
              assert row.get('sourceLabel'), f'Row {n} has no source label'
              assert row.get('verification') in {'verified', 'unverified'}, f'Row {n} has invalid status'
          print(f'Validated {len(rows)} sourced itinerary rows')
          PY
          python3 scripts/build_site.py --check
          python3 source-audit/scripts/validate_site.py
          python3 scripts/build_complete.py
          git diff --exit-code -- complete/
          python3 scripts/check_links.py
          node scripts/verify-session-2a9f9e6e.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site (all 7 integrated itinerary sites)
        run: |
          mkdir -p _site
          cp *.html styles.css app.js .nojekyll _site/
          cp -r assets _site/assets
          cp -r portal _site/portal
          cp -r source-audit _site/source-audit
          cp -r complete _site/complete
          cp -r data _site/data
          cp -r docs _site/docs
          cp -r trip _site/trip
          cp -r guide _site/guide
          if [ -d pages ]; then cp -r pages _site/pages; fi
          if [ -d verified ]; then cp -r verified _site/verified; fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
