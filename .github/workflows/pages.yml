name: Deploy Korea itinerary to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate itinerary datasets & cross-site links across all sessions
        run: |
          python3 -m json.tool data/itinerary.json >/dev/null
          python3 -m json.tool data/itinerary-sources.json >/dev/null
          python3 -m json.tool data/sources.json >/dev/null
          python3 - <<'PY'
          import json
          rows = json.load(open('data/itinerary.json', encoding='utf-8'))
          registry = json.load(open('data/itinerary-sources.json', encoding='utf-8'))['sources']
          assert rows, 'No itinerary rows found'
          assert len({source['id'] for source in registry}) == len(registry), 'Source IDs must be unique'
          sources = {source['id']: source for source in registry}
          for n, row in enumerate(rows, 1):
              assert row.get('item'), f'Row {n} has no item'
              assert row.get('sourceLabel'), f'Row {n} has no source label'
              assert row.get('verification') in {'verified', 'unverified'}, f'Row {n} has invalid status'
              assert row.get('flag'), f'Row {n} has no review note'
              links = row.get('sourceLinks')
              assert links, f'Row {n} has no registered source links'
              assert row.get('source') == links[0].get('url'), f'Row {n} primary URL does not match its first source link'
              assert row.get('sourceLabel') == links[0].get('label'), f'Row {n} primary label does not match its first source link'
              for link in links:
                  assert link.get('id') in sources, f'Row {n} references unknown source ID {link.get("id")}'
                  assert link.get('url', '').startswith('https://'), f'Row {n} has a non-HTTPS source'
                  assert link['url'] == sources[link['id']]['url'], f'Row {n} URL does not match registry for {link["id"]}'
              primary = sources[links[0]['id']]
              assert primary.get('type') == 'official', f'Row {n} primary source is not official'
          print(f'Validated {len(rows)} sourced itinerary rows and {len(registry)} registered sources')
          PY
          python3 scripts/build_site.py --check
          python3 source-audit/scripts/validate_site.py
          python3 scripts/check_links.py
          node scripts/verify-session-2a9f9e6e.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site (all 7 integrated itinerary sites)
        run: |
          mkdir -p _site
          cp *.html styles.css app.js .nojekyll _site/
          cp -r assets _site/assets
          cp -r portal _site/portal
          cp -r source-audit _site/source-audit
          cp -r data _site/data
          cp -r docs _site/docs
          cp -r trip _site/trip
          if [ -d pages ]; then cp -r pages _site/pages; fi
          if [ -d verified ]; then cp -r verified _site/verified; fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
